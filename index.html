<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <title>BRONZEVILLE BLUES</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >


  <!-- ============================================
       MAPBOX
       ============================================ -->

  <script src="https://api.tiles.mapbox.com/mapbox-gl-js/v2.13.0/mapbox-gl.js"></script>

  <link
    href="https://api.tiles.mapbox.com/mapbox-gl-js/v2.13.0/mapbox-gl.css"
    rel="stylesheet"
  >


  <style>

    @font-face {
      font-family: "Frames";
      src: url("./FramesPartOne-Bold.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Goozette";
      src: url("./goozette.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* ============================================
       BASE
       ============================================ */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;
    }


    body {
      background-color: #707682;

      font-family:
        "Goozette",
        sans-serif;

      overflow: hidden;
    }



    /* ============================================
       PAGE LAYOUT

       DESKTOP:

       ----------------------------------
       |                   |            |
       |                   |   TITLE    |
       |                   |   AUDIO    |
       |      MAP          |   SONG     |
       |                   |            |
       |                   |   INFO     |
       |                   |            |
       |                   |   ACK.     |
       ----------------------------------

       ============================================ */

    #page {
      display: flex;

      width: 100%;
      height: 100%;
    }



    /* ============================================
       MAP
       ============================================ */

    #map {
      width: 72%;
      height: 100%;

      flex-shrink: 0;
    }



    /* ============================================
       SIDEBAR
       ============================================ */

    #sidebar {
      display: flex;
      flex-direction: column;

      width: 28%;
      height: 100%;

      min-width: 0;

      padding:
        1.5rem
        1rem
        1rem
        2%;

      background-color: #707682;
    }



    /* ============================================
       TITLE
       ============================================ */

    #title {
      margin:
        0
        0
        1rem
        0;

      padding: 0;

      color: white;

      font-family:
        "Frames",
        sans-serif;

      font-size:
        clamp(
          1.5rem,
          2.2vw,
          2.2rem
        );

      line-height: 1.2;

      flex-shrink: 0;
    }


    #title:hover {
      color: #ff99b3;

      cursor: default;
    }



    /* ============================================
       AUDIO
       ============================================ */

    #audio-container {
      flex-shrink: 0;

      margin-bottom: 1rem;
    }


    #audy {
      display: block;

      width: 100%;
      max-width: 300px;
    }


    #audy:focus {
      outline: none;
    }



    /* ============================================
       SONG TITLE
       ============================================ */

    #songz {
      min-height: 1rem;

      margin:
        0.45rem
        0
        0
        0;

      color: #a5b3c0;

      font-family:
        "Goozette",
        sans-serif;

      font-size: 0.9rem;

      line-height: 1.4;

      overflow-wrap: break-word;
    }



    /* ============================================
       INFORMATION CONTAINER
       ============================================ */

    #conty {
      flex: 1;

      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding-right: 0.5rem;


      /*
       * Firefox scrollbar
       */

      scrollbar-width: thin;

      scrollbar-color:
        #ff99b3
        transparent;
    }



    /* Chrome / Edge / Safari scrollbar */

    #conty::-webkit-scrollbar {
      width: 6px;
    }


    #conty::-webkit-scrollbar-track {
      background: transparent;
    }


    #conty::-webkit-scrollbar-thumb {
      background-color: #ff99b3;

      border-radius: 10px;
    }



    /* ============================================
       LOCATION INFORMATION
       ============================================ */

    #reviews {
      margin: 0;

      color: #111;

      font-family:
        "Goozette",
        sans-serif;

      font-size: 1rem;

      line-height: 1.6;

      overflow-wrap: break-word;
    }


    #reviews:hover {
      cursor: default;
    }



    /* ============================================
       INITIAL MESSAGE
       ============================================ */

    #instructions {
      margin:
        1rem
        0
        0
        0;

      color: white;

      font-size: 1rem;

      line-height: 1.5;
    }



    /* ============================================
       LOCATION DETAILS
       ============================================ */

    .location-name {
      margin:
        0
        0
        0.4rem
        0;

      color: white;

      font-size: 1.1rem;

      line-height: 1.4;
    }


    .location-address {
      margin:
        0
        0
        1.2rem
        0;

      color: #111;

      line-height: 1.5;
    }


    .location-description {
      margin: 0;

      color: #111;

      line-height: 1.65;

      white-space: pre-line;
    }



    /* ============================================
       ACKNOWLEDGEMENTS
       ============================================ */

    #submissions {
      display: inline-block;

      align-self: flex-start;

      flex-shrink: 0;

      min-height: 44px;

      margin:
        1rem
        0
        0
        0;

      padding: 0;

      color: #ff99b3;

      background: none;

      border: none;

      font-family:
        "Goozette",
        sans-serif;

      font-size: large;

      line-height: 1.4;

      text-align: left;

      cursor: pointer;

      appearance: none;
      -webkit-appearance: none;

      transition:
        color
        0.15s
        ease;
    }


    #submissions:hover {
      color: white;
    }


    #submissions:focus-visible {
      color: white;

      outline:
        2px
        solid
        #ff99b3;

      outline-offset: 4px;
    }



    /* ============================================
       MAPBOX POPUPS
       ============================================ */

    .mapboxgl-popup {
      max-width: 260px !important;
    }


    .mapboxgl-popup-content {
      padding:
        10px
        12px;

      font-family:
        "Goozette",
        sans-serif;

      font-size: 0.8rem;

      line-height: 1.45;
    }



    /* ============================================
       TABLETS
       ============================================ */

    @media (max-width: 1000px) {

      #map {
        width: 70%;
      }


      #sidebar {
        width: 30%;

        padding-left: 1.5rem;
      }


      #title {
        font-size: 1.7rem;
      }

    }



    /* ============================================
       MOBILE
       ============================================ */

    @media (max-width: 700px) {

      html,
      body {
        height: auto;

        min-height: 100%;
      }


      body {
        overflow-x: hidden;
        overflow-y: auto;
      }



      /* Stack map + sidebar */

      #page {
        display: flex;

        flex-direction: column;

        width: 100%;

        height: auto;

        min-height: 100vh;

        min-height: 100dvh;
      }



      /* ========================================
         MOBILE MAP
         ======================================== */

      #map {
        order: 1;

        width: 100%;

        height: 58vh;
        height: 58dvh;

        min-height: 340px;

        flex-shrink: 0;
      }



      /* ========================================
         MOBILE SIDEBAR
         ======================================== */

      #sidebar {
        order: 2;

        width: 100%;
        height: auto;

        min-height: 42vh;

        padding:
          1.3rem
          1.2rem
          calc(
            1.5rem +
            env(safe-area-inset-bottom)
          )
          1.2rem;
      }



      /* ========================================
         MOBILE TITLE
         ======================================== */

      #title {
        margin:
          0
          0
          1rem
          0;

        font-size: 1.8rem;
      }



      /* ========================================
         MOBILE AUDIO
         ======================================== */

      #audio-container {
        width: 100%;

        margin-bottom: 1rem;
      }


      #audy {
        width: 100%;
        max-width: 100%;
      }



      /* ========================================
         MOBILE INFO
         ======================================== */

      #conty {
        flex: none;

        width: 100%;

        min-height: 100px;

        overflow: visible;

        padding: 0;
      }


      #reviews {
        font-size: 0.9rem;
      }



      /* ========================================
         MOBILE ACKNOWLEDGEMENTS
         ======================================== */

      #submissions {
        margin-top: 1.5rem;

        font-size: 1rem;
      }

    }



    /* ============================================
       SMALL PHONES
       ============================================ */

    @media (max-width: 400px) {

      #map {
        height: 52vh;
        height: 52dvh;

        min-height: 300px;
      }


      #sidebar {
        padding:
          1rem
          1rem
          calc(
            1.25rem +
            env(safe-area-inset-bottom)
          )
          1rem;
      }


      #title {
        font-size: 1.55rem;
      }

    }



    /* ============================================
       REDUCED MOTION
       ============================================ */

    @media (
      prefers-reduced-motion:
      reduce
    ) {

      #submissions {
        transition: none;
      }

    }

  </style>

</head>



<body>


  <main id="page">


    <!-- ==========================================
         MAP
         ========================================== -->

    <div
      id="map"
      aria-label="Bronzeville Blues map"
    ></div>



    <!-- ==========================================
         SIDEBAR
         ========================================== -->

    <aside
      id="sidebar"
      aria-label="Bronzeville Blues information"
    >


      <!-- TITLE -->

      <p id="title">
        bronzeville blues
      </p>



      <!-- AUDIO -->

      <div id="audio-container">

        <audio
          id="audy"
          controls
          preload="none"
        >
          Your browser does not support the audio element.
        </audio>


        <p id="songz"></p>

      </div>



      <!-- LOCATION INFORMATION -->

      <div id="conty">

        <div
          id="reviews"
          aria-live="polite"
        >

          <p id="instructions">
            click a location on the map
            to explore its story
          </p>

        </div>

      </div>



      <!-- ACKNOWLEDGEMENTS -->

      <button
        id="submissions"
        type="button"
      >
        acknowledgements
      </button>


    </aside>


  </main>



  <script>

    /* ============================================
       SETTINGS
       ============================================ */

    /*
     * Keeping your existing Mapbox layer name in
     * one variable makes it easier to update later
     * if you change the layer in Mapbox Studio.
     */

    const BRONZEVILLE_LAYER =
      "bronzevilledata-9obyn8";



    /* ============================================
       ACKNOWLEDGEMENTS
       ============================================ */

    const acknowledgementsButton =
      document.getElementById(
        "submissions"
      );


    acknowledgementsButton.addEventListener(
      "click",
      () => {

        window.location.href =
          "submissions.html";

      }
    );



    /* ============================================
       MAPBOX TOKEN
       ============================================ */

    mapboxgl.accessToken =
      "pk.eyJ1Ijoic2Ftc21nciIsImEiOiJjbGduOXIxcGcwZGp2M2VudDN0OXk3cWw5In0.UiSK6syLTB30dzrXjxl7iw";



    /* ============================================
       CREATE MAP
       ============================================ */

    const map =
      new mapboxgl.Map({

        container: "map",

        style:
          "mapbox://styles/samsmgr/clh57t34q01as01qn7oj28q5w",

        center: [
          -87.619383,
          41.81617
        ],

        zoom: 11.7

      });



    /* ============================================
       POPUP
       ============================================ */

    const popup =
      new mapboxgl.Popup({

        closeButton: false,

        closeOnClick: false,

        offset: 8

      });



    /* ============================================
       MAP LOAD
       ============================================ */

    map.on(
      "load",
      () => {


        /*
         * Confirm that the existing Bronzeville
         * layer is present before registering
         * layer-specific events.
         */

        if (
          !map.getLayer(
            BRONZEVILLE_LAYER
          )
        ) {

          console.warn(
            'The Mapbox layer "' +
            BRONZEVILLE_LAYER +
            '" was not found.'
          );

          return;

        }



        /* ========================================
           MOUSE ENTER
           ======================================== */

        map.on(
          "mouseenter",
          BRONZEVILLE_LAYER,
          (event) => {


            map
              .getCanvas()
              .style
              .cursor =
              "pointer";


            if (
              !event.features ||
              !event.features.length
            ) {

              return;

            }


            const feature =
              event.features[0];


            if (
              !feature.geometry ||
              !feature.geometry.coordinates
            ) {

              return;

            }



            /*
             * This preserves the Point geometry
             * behavior from your original page.
             */

            const coordinates =
              feature
                .geometry
                .coordinates
                .slice();



            /*
             * Read Name and Date from the
             * selected Mapbox feature.
             */

            const name =
              cleanProperty(
                feature.properties.Name
              ) ||
              "Location";


            const date =
              cleanProperty(
                feature.properties.Date
              );



            /*
             * Handle maps that wrap horizontally.
             */

            while (
              Math.abs(
                event.lngLat.lng -
                coordinates[0]
              ) > 180
            ) {

              coordinates[0] +=
                event.lngLat.lng >
                coordinates[0]
                  ? 360
                  : -360;

            }



            /* ==================================
               BUILD POPUP SAFELY
               ================================== */

            const popupContent =
              document.createElement(
                "div"
              );


            const popupName =
              document.createElement(
                "strong"
              );


            popupName.textContent =
              name;


            popupContent.appendChild(
              popupName
            );



            /*
             * Do not create an empty Date line
             * when the feature has no date.
             */

            if (date) {

              const breakElement =
                document.createElement(
                  "br"
                );


              const dateElement =
                document.createElement(
                  "span"
                );


              dateElement.textContent =
                date;


              popupContent.append(
                breakElement,
                dateElement
              );

            }



            /*
             * Display popup.
             */

            popup
              .setLngLat(
                coordinates
              )
              .setDOMContent(
                popupContent
              )
              .addTo(map);

          }
        );



        /* ========================================
           MOUSE LEAVE
           ======================================== */

        map.on(
          "mouseleave",
          BRONZEVILLE_LAYER,
          () => {

            map
              .getCanvas()
              .style
              .cursor =
              "";

            popup.remove();

          }
        );

      }
    );



    /* ============================================
       CLICK LOCATION
       ============================================ */

    map.on(
      "click",
      (event) => {


        /*
         * Don't attempt to query the layer until
         * we know Mapbox has loaded it.
         */

        if (
          !map.getLayer(
            BRONZEVILLE_LAYER
          )
        ) {

          return;

        }



        const features =
          map.queryRenderedFeatures(
            event.point,
            {

              layers: [
                BRONZEVILLE_LAYER
              ]

            }
          );



        /*
         * If the user clicked somewhere other than
         * a Bronzeville feature, do nothing.
         */

        if (
          !features.length
        ) {

          return;

        }



        const feature =
          features[0];



        /* ========================================
           READ FEATURE INFORMATION
           ======================================== */

        const name =
          cleanProperty(
            feature.properties.Name
          ) ||
          "Location";


        const address =
          cleanProperty(
            feature.properties.Address
          );


        const description =
          cleanProperty(
            feature.properties.Description
          );


        const audioSource =
          cleanProperty(
            feature.properties.Song
          );


        const songName =
          cleanProperty(
            feature.properties.songName
          );



        /* ========================================
           UPDATE AUDIO
           ======================================== */

        updateAudio(
          audioSource,
          songName
        );



        /* ========================================
           UPDATE LOCATION INFORMATION
           ======================================== */

        updateLocationInformation(
          name,
          address,
          description
        );



        /* ========================================
           MOBILE SCROLL
           ======================================== */

        /*
         * After tapping a map feature on a phone,
         * smoothly bring its information into view.
         *
         * On desktop nothing moves.
         */

        if (
          window.matchMedia(
            "(max-width: 700px)"
          ).matches
        ) {

          document
            .getElementById(
              "title"
            )
            .scrollIntoView({

              behavior: "smooth",

              block: "start"

            });

        }

      }
    );



    /* ============================================
       UPDATE AUDIO
       ============================================ */

    function updateAudio(
      audioSource,
      songName
    ) {


      const audio =
        document.getElementById(
          "audy"
        );


      const songDisplay =
        document.getElementById(
          "songz"
        );



      /*
       * If Song exists, switch the player to it.
       */

      if (audioSource) {

        /*
         * Pause the previous recording before
         * loading the newly selected one.
         */

        audio.pause();


        audio.src =
          audioSource;


        audio.load();

      }


      /*
       * If the selected feature doesn't contain
       * an audio URL, clear the previous song.
       */

      else {

        audio.pause();


        audio.removeAttribute(
          "src"
        );


        audio.load();

      }



      /*
       * This replaces the original
       * "undefined" string check.
       */

      songDisplay.innerHTML =
        songName || "";

    }



    /* ============================================
       UPDATE LOCATION INFORMATION
       ============================================ */

    function updateLocationInformation(
      name,
      address,
      description
    ) {


      const reviewsContainer =
        document.getElementById(
          "reviews"
        );



      /*
       * Clear information from the previously
       * selected location.
       */

      reviewsContainer
        .replaceChildren();



      /* ========================================
         NAME
         ======================================== */

      const nameElement =
        document.createElement(
          "p"
        );


      nameElement.className =
        "location-name";


      const boldName =
        document.createElement(
          "b"
        );


      boldName.textContent =
        name;


      nameElement.appendChild(
        boldName
      );


      reviewsContainer.appendChild(
        nameElement
      );



      /* ========================================
         ADDRESS
         ======================================== */

      if (address) {

        const addressElement =
          document.createElement(
            "p"
          );


        addressElement.className =
          "location-address";


        addressElement.textContent =
          address;


        reviewsContainer.appendChild(
          addressElement
        );

      }



      /* ========================================
         DESCRIPTION
         ======================================== */

      if (description) {

        const descriptionElement =
          document.createElement(
            "p"
          );


        descriptionElement.className =
          "location-description";


        descriptionElement.innerHTML =
          description;


        reviewsContainer.appendChild(
          descriptionElement
        );

      }


      /*
       * Give a fallback if there's no description
       * or address associated with this location.
       */

      else if (!address) {

        const emptyDescription =
          document.createElement(
            "p"
          );


        emptyDescription.className =
          "location-description";


        emptyDescription.textContent =
          "No additional information available.";


        reviewsContainer.appendChild(
          emptyDescription
        );

      }

    }



    /* ============================================
       CLEAN MAPBOX PROPERTIES
       ============================================ */

    function cleanProperty(
      value
    ) {


      /*
       * Map data occasionally contains literal
       * strings such as "undefined", "null", etc.
       *
       * Treat them as empty values instead of
       * displaying those words to visitors.
       */

      if (
        value === undefined ||
        value === null
      ) {

        return "";

      }


      const cleanedValue =
        String(value).trim();


      if (
        cleanedValue === "" ||
        cleanedValue.toLowerCase() ===
          "undefined" ||
        cleanedValue.toLowerCase() ===
          "null" ||
        cleanedValue.toLowerCase() ===
          "nan"
      ) {

        return "";

      }


      return cleanedValue;

    }



    /* ============================================
       RESPONSIVE MAPBOX RESIZING
       ============================================ */

    /*
     * Mapbox needs to be notified when the map's
     * container dimensions change.
     *
     * This is particularly useful when switching
     * between the desktop and mobile layouts.
     */

    let resizeTimer;


    window.addEventListener(
      "resize",
      () => {


        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            () => {

              map.resize();

            },
            100
          );

      }
    );

  </script>


</body>

</html>
